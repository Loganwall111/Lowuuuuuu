<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlimited Possibilities Sandbox - Master Production Engine</title>
    <style>
        /* Essential full-screen layout normalization protecting 60 FPS frame timing */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020408;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #eef6ff;
            user-select: none;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            outline: none;
        }

        /* Glassmorphic App-Style User Interface Layer Stack */
        #hud-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
        }

        .interactive-element {
            pointer-events: auto;
        }

        /* Modular Floating Control Windows satisfying progressive mode disclosures */
        .panel {
            position: absolute;
            top: 16px;
            background: linear-gradient(180deg, rgba(8, 14, 28, 0.88), rgba(4, 8, 16, 0.75));
            border: 1px solid rgba(110, 180, 255, 0.2);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .panel.left { left: 16px; }
        .panel.right { right: 16px; }
        
        /* P0 Layout Defect Fix: Strict visibility handling classes */
        .panel.hidden {
            display: none !important;
            opacity: 0;
            transform: scale(0.95);
        }

        /* Centralized Layout Headers with Close Actions */
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(0, 0, 0, 0.2);
        }

        .panel-title {
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-size: 11px;
            color: #8ecaff;
        }

        /* Fixed Close Buttons triggering systematic close actions */
        .close-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s;
        }

        .close-btn:hover {
            background: rgba(255, 50, 50, 0.2);
            color: #ff6b6b;
        }

        .panel-content {
            padding: 16px;
            overflow-y: auto;
            max-height: 75vh;
        }

        /* Centralized Navigation Header Rig */
        .topbar-nav {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(6, 10, 20, 0.8);
            padding: 6px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: #a6c8e0;
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .nav-btn.active {
            background: #1b4d6e;
            color: #fff;
            border: 1px solid #4aa3d6;
            box-shadow: 0 0 12px rgba(74, 163, 214, 0.4);
        }

        /* Floating Recovery Trigger Anchor */
        .menu-reopen-anchor {
            position: absolute;
            bottom: 24px;
            left: 24px;
            background: #0c1524;
            border: 1px solid #2c425c;
            color: #8ecaff;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            transition: background 0.15s, border-color 0.15s;
        }

        .menu-reopen-anchor:hover {
            background: #14223a;
            border-color: #43648a;
        }
    </style>
</head>
<body>

    <div id="hud-container">
        <!-- Central Simulation Navigation Hub Overlay -->
        <div class="topbar-nav interactive-element" id="scaleTopbar">
            <button class="nav-btn active" id="btn-planetary">Planetary Scale</button>
            <button class="nav-btn" id="btn-stellar">Stellar Scale</button>
            <button class="nav-btn" id="btn-fluid">Fluid Physics Lab</button>
        </div>

        <!-- Left Operations Sandbox Master Menu Matrix -->
        <div id="panel-operations" class="panel left interactive-element">
            <div class="panel-header">
                <div class="panel-title" id="panelTitle">Simulation Core Matrix</div>
                <button class="close-btn" id="panelCloseBtn" data-close="panel-operations">✕</button>
            </div>
            <div class="panel-content" id="panelContent">
                <div style="font-size: 11px; opacity: 0.6; line-height: 1.5;">
                    Adjust multi-scale gravity systems or drop physics elements into active refraction fields.
                </div>
            </div>
        </div>

        <!-- System Reopen Trigger Node Floating Anchor -->
        <div id="menu-launcher" class="menu-reopen-anchor interactive-element" title="Open Simulation Core Panels">
            🌌
        </div>
    </div>

    <!-- The Primary 3D Canvas Context -->
    <canvas id="renderCanvas" tabIndex="1"></canvas>

    <!-- Production App Assembly Pipeline Mount Point -->
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
