# DEVOURING STORMS — built-in shader pack
# Iris / OptiFine compatible. Dark-weight profile: no shadows, all atmosphere.

# Sun/moon stay vanilla; the storm does the talking.
clouds=vanilla
sky.stars=vanilla
sun=true
moon=true

# We handle fog and grade ourselves in gbuffers/composite/final.
shadow.enabled=false
particles.before=false

# DEVOURING STORMS v1.4 sliders — set to 0.0 to disable any layer.
profile=compatible
DS_LENSING=1
DS_GRAIN=1
DS_VIGNETTE=1
DS_CHROMA=1
DS_CLOUD_CHURN=1
DS_CLOUD_COVER=1
DS_RIFT_GLOW=1
DS_SKY_DARKNESS=1
DS_MAW_SKY=1
