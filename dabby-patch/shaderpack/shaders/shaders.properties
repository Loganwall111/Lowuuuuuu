# Wither Storm Skies - Story Mode shaderpack
# Companion pack to Dabby's Wither Storm Mod.
#
# Nothing here may reference a program or texture that does not exist:
# Iris refuses to load the whole pack if it does.

screen = [Sky] [Aurora] [Biome] [Storm] [Color]

screen.Sky = SKY_STORY_MODE SKY_SATURATION HORIZON_GLOW SKY_DAY_R SKY_DAY_G SKY_DAY_B \
             SKY_NIGHT_R SKY_NIGHT_G SKY_NIGHT_B SKY_DUSK_R SKY_DUSK_G SKY_DUSK_B

screen.Aurora = AURORA AURORA_STRENGTH AURORA_SPEED AURORA_HEIGHT AURORA_COVERAGE \
                AURORA_R AURORA_G AURORA_B AURORA_TIP_R AURORA_TIP_G AURORA_TIP_B

screen.Biome = BIOME_SKIES BIOME_STRENGTH \
               BIOME_DESERT_R BIOME_DESERT_G BIOME_DESERT_B \
               BIOME_SNOW_R BIOME_SNOW_G BIOME_SNOW_B \
               BIOME_SWAMP_R BIOME_SWAMP_G BIOME_SWAMP_B \
               BIOME_NETHER_R BIOME_NETHER_G BIOME_NETHER_B

screen.Storm = STORM_PURPLE_ON STORM_PURPLE STORM_VIGNETTE_ON STORM_VIGNETTE

screen.Color = TONEMAP EXPOSURE CONTRAST VIBRANCE BLOOM BLOOM_STRENGTH

sliders = SKY_SATURATION SKY_DAY_R SKY_DAY_G SKY_DAY_B SKY_NIGHT_R SKY_NIGHT_G SKY_NIGHT_B \
          SKY_DUSK_R SKY_DUSK_G SKY_DUSK_B \
          AURORA_STRENGTH AURORA_SPEED AURORA_HEIGHT AURORA_COVERAGE \
          AURORA_R AURORA_G AURORA_B AURORA_TIP_R AURORA_TIP_G AURORA_TIP_B \
          BIOME_STRENGTH BIOME_DESERT_R BIOME_DESERT_G BIOME_DESERT_B \
          BIOME_SNOW_R BIOME_SNOW_G BIOME_SNOW_B BIOME_SWAMP_R BIOME_SWAMP_G BIOME_SWAMP_B \
          BIOME_NETHER_R BIOME_NETHER_G BIOME_NETHER_B \
          STORM_PURPLE STORM_VIGNETTE EXPOSURE CONTRAST VIBRANCE BLOOM_STRENGTH

# defaults ship at Max Spectacle
option.SKY_STORY_MODE=true
option.AURORA=true
option.BIOME_SKIES=true
option.BLOOM=true
option.TONEMAP=true
