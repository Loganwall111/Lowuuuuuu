# ============================================================
#  STORY MODE VISUALS - Iris / Oculus shader pack (1.20.1)
#  Telltale "Minecraft: Story Mode" style renderer
#  HUGE config menu: presets, sliders, 18 toggles
# ============================================================

profile=HIGH

# ---------------- render pipeline (old OptiFine-style, Iris 1.20.1)
screen=composite

shaders=gbuffers_basic,gbuffers_skybasic,gbuffers_skytextured,gbuffers_clouds,gbuffers_terrain,gbuffers_terrain_cutout,gbuffers_terrain_cutout_mipped,gbuffers_entities,gbuffers_block,gbuffers_hand,gbuffers_textured,gbuffers_textured_lit,gbuffers_water,composite,final,shadow

# ----------------------------------------------------------------
# SETTINGS MENU IDENTITY
#   The shader's own settings screen is defined in lang/en_US.lang:
#     screen.MAIN = Story Mode Visuals
#   (menu id token: story_mode_menu)
#
# NOTE: Embeddium's warning "Id must be specified in OptionPage
# 'Shader Packs...'" refers to the options-page button that the OCULUS
# MOD itself registers inside Embeddium's video settings - it is created
# by Oculus, not by this pack, and cannot be defined from inside a
# shader pack. It is a benign warning and unrelated to shader loading.
# The pack's own 36-option settings screen (Shader Pack Settings)
# appears automatically once the pipeline compiles successfully.
# ----------------------------------------------------------------

# ---------------- buffers
textures=colortex0,colortex1,colortex2,depthtex0,depthtex1,shadowtex0,shadowcolor0,shadowcolor1
colortex0.format=RGBA8
colortex1.format=RGBA8
colortex2.format=RGBA8
shadowcolor0.format=RGBA8
shadowcolor1.format=RGBA8
buffers=shadow:shadowcolor0:shadowcolor1

# ============================================================
# PRESETS
# ============================================================
SETTINGS.STYLE=0
SETTINGS.PRESET.story=0
SETTINGS.PRESET.vibrant=1
SETTINGS.PRESET.moody=2

SETTINGS.SKY_PRESET=0
SETTINGS.PRESET.classic=0
SETTINGS.PRESET.bright=1
SETTINGS.PRESET.cinematic=2

# ============================================================
# SLIDERS
# ============================================================
SETTINGS.SUNSET=1.0 0.0 2.0 0.05
SETTINGS.CLOUD_SPEED=1.0 0.25 2.0 0.05
SETTINGS.CLOUD_COVER=0.5 0.0 1.0 0.01
SETTINGS.CLOUD_DENSITY=1.0 0.0 2.0 0.05
SETTINGS.CLOUD_COLORIZE=1.0 0.0 1.0 0.01
SETTINGS.RAIN_STR=0.4 0.0 1.0 0.01
SETTINGS.TERRAIN_AO_STR=1.0 0.0 1.0 0.01
SETTINGS.TORCH_SAT=1.2 0.0 2.0 0.05
SETTINGS.ENT_AO=1.0 0.0 1.0 0.01
SETTINGS.HAND_LIGHT=0.0 0.0 2.0 0.05
SETTINGS.FOG_STR=1.0 0.0 2.0 0.05
SETTINGS.SKY_FOG_MIX=0.5 0.0 1.0 0.01
SETTINGS.MOON_SIZE=1.0 0.5 1.5 0.05
SETTINGS.MOONSHINE=1.0 0.0 2.0 0.05
SETTINGS.VIGNETTE_STR=1.0 0.0 2.0 0.05
SETTINGS.SATURATION=1.18 0.0 2.0 0.05

# ============================================================
# TOGGLES (18)
# ============================================================
DEFINE.CEL_BANDS=1
DEFINE.FLAT_LIGHTING=0
DEFINE.SHADOW=1
DEFINE.SHADOW_SOFT=0
DEFINE.ENTITY_SOFT_SHADOW=1
DEFINE.CLOUD_SHADOWS=1
DEFINE.TERRAIN_AO=1
DEFINE.TORCH_TINT=1
DEFINE.HEAT_SHIMMER=1
DEFINE.AURORA=1
DEFINE.WATER_FOAM=1
DEFINE.SSAO=1
DEFINE.GODRAYS=1
DEFINE.BLOOM=1
DEFINE.OUTLINE=1
DEFINE.VIGNETTE=1
DEFINE.LETTERBOX=0
DEFINE.FILM_GRAIN=1
