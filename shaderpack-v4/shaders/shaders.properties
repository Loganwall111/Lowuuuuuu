# ============================================================================
#  MCSShaders v4 - "the mod drives, the shader garnishes"
#
#  The Wither Storm mod owns, in its own baked core shaders:
#      the sky, the Story Mode cloud deck, sun/moon shadows, cloud shadows,
#      the sun glow, fog palettes, storm occlusion and the vivid tone curve.
#
#  This shader pack deliberately does NOT touch any of those. It has exactly
#  two visible jobs left:
#      1. Aurora Borealis  (VFX)
#      2. Colourful lighting (warm day / cool night key tint)
#
#  Everything else ships OFF and is opt-in, so enabling the pack no longer
#  changes the look of the world.
# ============================================================================

screen = [Aurora] [Lighting] [Extra]

screen.Aurora = AURORA AURORA_STRENGTH AURORA_SPEED AURORA_HEIGHT AURORA_COVERAGE \
                AURORA_R AURORA_G AURORA_B AURORA_TIP_R AURORA_TIP_G AURORA_TIP_B

screen.Lighting = COLORED_LIGHT COLORED_LIGHT_AMT

screen.Extra = BLOOM BLOOM_STRENGTH VIBRANCE EXPOSURE CONTRAST TONEMAP

sliders = AURORA_STRENGTH AURORA_SPEED AURORA_HEIGHT AURORA_COVERAGE \
          AURORA_R AURORA_G AURORA_B AURORA_TIP_R AURORA_TIP_G AURORA_TIP_B \
          COLORED_LIGHT_AMT BLOOM_STRENGTH VIBRANCE EXPOSURE CONTRAST

# --- v4 defaults: aurora + colourful lighting ONLY ---
option.AURORA=true
option.COLORED_LIGHT=true

# the mod owns all of these now - off so we never fight it
option.SKY_STORY_MODE=false
option.BIOME_SKIES=false
option.STORM_PURPLE_ON=false
option.STORM_VIGNETTE_ON=false
option.BLOOM=false
option.TONEMAP=false
