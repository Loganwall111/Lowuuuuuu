<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>UNLIMITED POSSIBILITIES SANDBOX</title>
  <meta name="description" content="A real-time universe sandbox: procedural star systems, ray-traced oceans and gravitationally lensed black holes." />
  <link rel="icon" href="/Low/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /*
     * CRITICAL: this page must never be able to show a black screen.
     *
     * Everything below is plain CSS/HTML that renders before a single line of
     * JavaScript executes. If the module fails to load, fails to parse, or
     * throws at import time, the user still sees a lit background and a
     * status panel that says so - never an unexplained black rectangle.
     */
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #0a1024;
      /* A visible field, so "nothing rendered" still looks like something. */
      background:
        radial-gradient(1200px 800px at 22% 18%, #1c2a55 0%, rgba(28,42,85,0) 60%),
        radial-gradient(1000px 700px at 78% 82%, #2a1c4a 0%, rgba(42,28,74,0) 62%),
        linear-gradient(160deg, #0d1430 0%, #070c1c 100%);
      color: #e8edff;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #renderCanvas {
      position: fixed; inset: 0; width: 100%; height: 100%;
      display: block; outline: none; touch-action: none;
      /* Transparent so the lit body shows through until the first frame. */
      background: transparent;
      z-index: 0;
    }

    /* ---- static boot panel: exists in the HTML, not created by JS ---- */
    #staticBoot {
      position: fixed; inset: 0; z-index: 40;
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(ellipse at 50% 40%, rgba(20,32,68,.35) 0%, rgba(8,13,28,.72) 70%);
      transition: opacity .45s ease;
    }
    #staticBoot.gone { opacity: 0; pointer-events: none; }
    .sb-in { text-align: center; max-width: 640px; padding: 0 24px; }
    .sb-name {
      font-size: 13px; font-weight: 800; letter-spacing: .42em;
      text-transform: uppercase; color: #9fb4ff; margin-bottom: 14px;
    }
    .sb-title {
      font-size: 30px; font-weight: 800; letter-spacing: -.01em;
      line-height: 1.15; margin-bottom: 10px;
      background: linear-gradient(180deg, #ffffff 0%, #b9c8ff 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .sb-sub { font-size: 13px; color: #8ea0cc; margin-bottom: 22px; }
    .sb-bar {
      height: 3px; border-radius: 3px; overflow: hidden;
      background: rgba(255,255,255,.10); margin: 0 auto; width: 260px;
    }
    .sb-fill {
      height: 100%; width: 18%; border-radius: 3px;
      background: linear-gradient(90deg, #4d7cff, #a97bff);
      animation: sbPulse 1.5s ease-in-out infinite;
    }
    @keyframes sbPulse {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(560%); }
    }
    .sb-msg { margin-top: 14px; font-size: 12px; color: #7d8db8; }

    /* ---- failure panel: only revealed if boot genuinely fails ---- */
    #bootFail {
      display: none;
      position: fixed; z-index: 60; inset: auto 0 0 0;
      margin: 0 auto 0; max-width: 720px;
      padding: 18px 20px 20px;
      border-radius: 14px 14px 0 0;
      background: rgba(14,20,40,.96);
      border: 1px solid rgba(255,120,120,.35);
      border-bottom: none;
      box-shadow: 0 -18px 60px rgba(0,0,0,.5);
      text-align: left;
    }
    #bootFail h3 {
      margin: 0 0 8px; font-size: 14px; font-weight: 700; color: #ff9f9f;
    }
    #bootFail p { margin: 0 0 10px; font-size: 12.5px; color: #c2cdf0; line-height: 1.5; }
    #bootFail pre {
      margin: 0; padding: 10px 12px; border-radius: 8px;
      background: rgba(0,0,0,.42); color: #ffd7d7;
      font-size: 11.5px; line-height: 1.45; max-height: 190px; overflow: auto;
      white-space: pre-wrap; word-break: break-word;
    }
    #bootFail button {
      margin-top: 12px; padding: 7px 14px; border-radius: 8px; cursor: pointer;
      background: #2f4bb0; color: #fff; border: none; font-size: 12px; font-weight: 600;
    }
  </style>
  <script type="module" crossorigin src="/Low/assets/index-DvRDAbgG.js"></script>
</head>
<body>
  <canvas id="renderCanvas" touch-action="none"></canvas>

  <!-- Rendered by the browser immediately. Removed by the app once it boots. -->
  <div id="staticBoot">
    <div class="sb-in">
      <div class="sb-name">Unlimited Possibilities</div>
      <div class="sb-title">SANDBOX</div>
      <div class="sb-sub">Building the universe&hellip;</div>
      <div class="sb-bar"><div class="sb-fill"></div></div>
      <div class="sb-msg" id="sbMsg">loading modules</div>
    </div>
  </div>

  <div id="bootFail">
    <h3>The simulation could not start</h3>
    <p id="bootFailWhy">Something failed before the first frame was drawn.</p>
    <pre id="bootFailDetail">no detail captured</pre>
    <button onclick="location.reload()">Reload</button>
  </div>

  <script>
    /*
     * Boot guard. Runs before the module, so it is still alive even if the
     * module never loads. Its only job is to make failure VISIBLE instead of
     * black - the app used to build its own loading overlay in JS, which
     * meant an import-time throw left nothing on screen at all.
     */
    (function () {
      var failed = false;

      function fail(why, detail) {
        // Once a hardware frame has completed this is no longer a startup
        // failure. Late optional shader/asset rejections belong in the
        // console, not in a fatal card over a visibly running game.
        if (window.__renderLoopAlive) {
          console.warn('[non-fatal runtime rejection]', why, detail || '');
          return;
        }
        if (failed) return;
        failed = true;
        var sb = document.getElementById('staticBoot');
        if (sb) sb.classList.add('gone');
        var box = document.getElementById('bootFail');
        var w = document.getElementById('bootFailWhy');
        var d = document.getElementById('bootFailDetail');
        if (w) w.textContent = why;
        if (d) d.textContent = String(detail || 'no detail captured').slice(0, 1500);
        if (box) box.style.display = 'block';
      }
      window.__bootFail = fail;

      // WebGL is the one hard requirement. Say so plainly rather than
      // rendering nothing.
      try {
        var c = document.createElement('canvas');
        var gl = c.getContext('webgl2') || c.getContext('webgl');
        if (!gl) {
          fail('This browser or GPU is not providing WebGL.',
               'navigator.userAgent:\n' + navigator.userAgent +
               '\n\nHardware acceleration may be disabled. In Chrome check ' +
               'chrome://gpu and enable "Use graphics acceleration when available".');
        }
      } catch (e) {
        fail('WebGL could not be initialised.', e && e.message);
      }

      window.addEventListener('error', function (ev) {
        // Module/script load failures surface here with no message.
        var t = ev.target;
        if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
          if (t.tagName === 'LINK') return; // a missing font is not fatal
          fail('A script failed to load.', 'src: ' + (t.src || t.href));
          return;
        }
        fail('A script error stopped the boot.',
             (ev.message || 'unknown error') + '\n' +
             (ev.filename ? ev.filename + ':' + ev.lineno + ':' + ev.colno : '') +
             (ev.error && ev.error.stack ? '\n\n' + ev.error.stack : ''));
      }, true);

      window.addEventListener('unhandledrejection', function (ev) {
        var r = ev.reason;
        fail('Startup failed.', (r && (r.stack || r.message)) || String(r));
      });

      // If nothing has drawn after 20s, the app is wedged. Say so.
      setTimeout(function () {
        if (window.__appBooted || failed) return;
        fail('The simulation is still loading after 20 seconds.',
             'The page loaded but the first frame never arrived. ' +
             'This usually means a shader failed to compile on this GPU, or ' +
             'a world is stuck building.\n\nOpen the browser console for the ' +
             'underlying error.');
      }, 20000);
    })();
  </script>

</body>
</html>
