            echo "- jar:      $(basename out/*.jar | head -1)"
            echo "- sha256:   $(cut -d' ' -f1 out/*.sha256 | head -1)"
          } > /tmp/release-notes-build369.md
          gh release create "$TAG" \
            --repo Loganwall111/Lowuuuuuu \
            --target "${GITHUB_SHA}" \
            --title "Devouring Storms: The Point of No Return ${VER}-26.2-beta (Build #369)" \
            --notes-file /tmp/release-notes-build369.md \
            out/*.jar out/*.sha256
          ( cd storylook && zip -q -r "/tmp/devouringstorms-storylook-${VER}-build369.zip" . )
          gh release upload "$TAG" "/tmp/devouringstorms-storylook-${VER}-build369.zip" --clobber \
            || echo "::warning::story look pack upload failed"
          ( cd shaderpack-v5 && zip -q -r "/tmp/devouringstorms-shaderpack-v5-${VER}-build369.zip" shaders )
          gh release upload "$TAG" "/tmp/devouringstorms-shaderpack-v5-${VER}-build369.zip" --clobber \
            || echo "::warning::shader pack upload failed"
          ( cd shaderpack-superduper && zip -q -r "/tmp/devouringstorms-superduper-default-${VER}-build369.zip" shaders DEVOURING_STORMS_MERGE.md pack.mcmeta )
          gh release upload "$TAG" "/tmp/devouringstorms-superduper-default-${VER}-build369.zip" --clobber \
            || echo "::warning::super duper default shader pack upload failed"
      - name: "Deploy the Phase 4/5.5 model rewrite as Build #370"
        # Session deploy step: publishes the jar with the WitherStormP4 entity
        # geometry REWRITTEN from the clean MCSM Blockbench StageB source
        # (Stage_B/witherstormStageB.bbmodel) via ci/modelgen/boxify.py —
