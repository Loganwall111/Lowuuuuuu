            echo ""
            echo "- commit:   ${GITHUB_SHA}"
            echo "- run:      https://github.com/Loganwall111/Lowuuuuuu/actions/runs/${GITHUB_RUN_ID}"
            echo "- jar:      $(basename out/*.jar | head -1)"
            echo "- sha256:   $(cut -d' ' -f1 out/*.sha256 | head -1)"
          } > /tmp/release-notes-build370.md
          gh release create "$TAG" \
            --repo Loganwall111/Lowuuuuuu \
            --target "${GITHUB_SHA}" \
            --title "Devouring Storms: The Point of No Return ${VER}-26.2-beta (Build #370)" \
            --notes-file /tmp/release-notes-build370.md \
            out/*.jar out/*.sha256
          ( cd storylook && zip -q -r "/tmp/devouringstorms-storylook-${VER}-build370.zip" . )
          gh release upload "$TAG" "/tmp/devouringstorms-storylook-${VER}-build370.zip" --clobber \
            || echo "::warning::story look pack upload failed"
          ( cd shaderpack-v5 && zip -q -r "/tmp/devouringstorms-shaderpack-v5-${VER}-build370.zip" shaders )
          gh release upload "$TAG" "/tmp/devouringstorms-shaderpack-v5-${VER}-build370.zip" --clobber \
            || echo "::warning::shader pack upload failed"
          ( cd shaderpack-superduper && zip -q -r "/tmp/devouringstorms-shaderpack-superduper-default-${VER}-build370.zip" shaders DEVOURING_STORMS_MERGE.md pack.mcmeta )
          gh release upload "$TAG" "/tmp/devouringstorms-shaderpack-superduper-default-${VER}-build370.zip" --clobber \
            || echo "::warning::super duper default shader pack upload failed"
      - name: "Deploy the OG-default geometry + menu unfreeze as Build #371"
        # Session deploy step: publishes the jar with the Build #371 work —
