        # session branch and idempotent: once ds-10000.0.0-alpha.338-build369
        # exists it is left alone.
        if: success() && github.ref == 'refs/heads/arena/01a09c3d-lowuuuuuu'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
