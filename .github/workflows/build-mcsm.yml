name: Build Devouring Storms jar

# ----------------------------------------------------------------------------
# The "GitHub compiler": the sandbox has no JDK and no route to Mojang/Maven,
# so every push to a listed arena branch builds the full jar on a runner that
# has both. Artifacts appear on the run page; when the VERSION file bumps to a
# version with no release yet, a release carrying the jar is created
# automatically. MCSM 1.9.109: that now happens from any arena branch, because
# the release tag is derived from VERSION and an existing tag is never
# overwritten -- so branches cannot collide, and a dispatched test build no
# longer leaves the user hunting through run pages for an artifact.
#
# NOTE: this file lives in .github/workflows/ so GitHub actually runs it.
# ci/workflows/build-mcsm.yml is kept as a mirror/template of the same recipe.
# ----------------------------------------------------------------------------

on:
  push:
    branches: ['arena/**', 'main']
  workflow_dispatch:

permissions:
  contents: write   # allow the job to publish the release with the built jar

concurrency:
  group: mcsm-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Build the jar
        run: bash ci/build.sh

      - name: Upload built jar and build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcsm-jar-${{ github.run_number }}
          path: |
            out/*.jar
            out/*.sha256
            out/*.txt

      - name: Publish release when VERSION is new
        # MCSM 1.9.109 -- publish from ANY arena branch. The tag comes from
        # VERSION and the step already refuses to touch an existing tag, so two
        # branches cannot collide: whichever builds a new version first owns that
        # release and the rest leave it alone. This used to be gated to two named
        # branches, which meant a dispatched build anywhere else produced an
        # artifact only -- and an artifact needs a logged-in click-through on the
        # run page, with a run-numbered name that says nothing about the version.
        # That is part of the "which build did I actually install?" confusion this
        # release exists to end, so the gate is now the tag check alone.
        if: success() && startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="$(cat VERSION | tr -d '[:space:]')"
          TAG="ds-${VER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — leaving it alone"
          else
            gh release create "$TAG" \
              --repo Loganwall111/Lowuuuuuu \
              --target "${GITHUB_REF#refs/heads/}" \
              --title "Devouring Storms: The Point of No Return ${VER}-26.2-beta" \
              --notes-file ci/RELEASE_NOTES.md \
              out/*.jar out/*.sha256
          fi

      - name: Attach Story Look resource pack to the release
        if: success() && startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="$(cat VERSION | tr -d '[:space:]')"
          TAG="ds-${VER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            ( cd storylook && zip -q -r "/tmp/devouringstorms-storylook-${VER}.zip" . )
            gh release upload "$TAG" "/tmp/devouringstorms-storylook-${VER}.zip" --clobber \
              || echo "::warning::story look pack upload failed"
          else
            echo "no release $TAG yet - skipping story look attach"
          fi

      - name: Attach the Devouring Storms shader pack to the release
        if: success() && startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="$(cat VERSION | tr -d '[:space:]')"
          TAG="ds-${VER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            ( cd shaderpack-v5 && zip -q -r "/tmp/devouringstorms-shaderpack-v5-${VER}.zip" shaders )
            gh release upload "$TAG" "/tmp/devouringstorms-shaderpack-v5-${VER}.zip" --clobber \
              || echo "::warning::shader pack upload failed"
            ( cd shaderpack-superduper && zip -q -r "/tmp/devouringstorms-superduper-default-${VER}.zip" shaders DEVOURING_STORMS_MERGE.md pack.mcmeta )
            gh release upload "$TAG" "/tmp/devouringstorms-superduper-default-${VER}.zip" --clobber \
              || echo "::warning::super duper default shader pack upload failed"
          else
            echo "no release $TAG yet - skipping shader pack attach"
          fi

      - name: "Deploy the restored codebase as Build #364"
        # Session deploy step: publishes the fresh full-compile jar of the
        # restored Build #351 layout (Build #338 texture registry, strict
        # 10000.0.0-alpha.338 technical version, hardcoded visual title) as
        # the numbered "Build #364" release. Gated to this session branch and
        # idempotent: once ds-10000.0.0-alpha.338-build364 exists it is left
        # alone, so later runs on the branch never re-deploy over it.
        if: success() && github.ref == 'refs/heads/arena/01a09c3d-lowuuuuuu'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="$(cat VERSION | tr -d '[:space:]')"
          TAG="ds-${VER}-build364"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — leaving it alone"
            exit 0
          fi
          {
            cat ci/RELEASE_NOTES.md
            echo ""
            echo "---"
            echo "**Build #364 deployment evidence**"
            echo ""
            echo "- commit:   ${GITHUB_SHA}"
            echo "- run:      https://github.com/Loganwall111/Lowuuuuuu/actions/runs/${GITHUB_RUN_ID}"
            echo "- jar:      $(basename out/*.jar | head -1)"
            echo "- sha256:   $(cut -d' ' -f1 out/*.sha256 | head -1)"
          } > /tmp/release-notes-build364.md
          gh release create "$TAG" \
            --repo Loganwall111/Lowuuuuuu \
            --target "${GITHUB_SHA}" \
            --title "Devouring Storms: The Point of No Return ${VER}-26.2-beta (Build #364)" \
            --notes-file /tmp/release-notes-build364.md \
            out/*.jar out/*.sha256
          ( cd storylook && zip -q -r "/tmp/devouringstorms-storylook-${VER}-build364.zip" . )
          gh release upload "$TAG" "/tmp/devouringstorms-storylook-${VER}-build364.zip" --clobber \
            || echo "::warning::story look pack upload failed"
          ( cd shaderpack-v5 && zip -q -r "/tmp/devouringstorms-shaderpack-v5-${VER}-build364.zip" shaders )
          gh release upload "$TAG" "/tmp/devouringstorms-shaderpack-v5-${VER}-build364.zip" --clobber \
            || echo "::warning::shader pack upload failed"
          ( cd shaderpack-superduper && zip -q -r "/tmp/devouringstorms-superduper-default-${VER}-build364.zip" shaders DEVOURING_STORMS_MERGE.md pack.mcmeta )
          gh release upload "$TAG" "/tmp/devouringstorms-superduper-default-${VER}-build364.zip" --clobber \
            || echo "::warning::super duper default shader pack upload failed"
