name: Build MCSM Wither Storm jar

on:
  push:
    branches: [arena/01a06f0e-lowuuuuuu]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcsm-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Test build safeguards
        run: python3 -m unittest discover -s ci/tests -v

      - name: Compile and verify the JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          bash ci/build.sh 2>&1 | tee out/build.log

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: mcsm-jar-${{ github.run_number }}
          path: |
            out/*.jar
            out/*.sha256
            out/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcsm-build-logs-${{ github.run_number }}
          path: out/*.log
          if-no-files-found: ignore
          retention-days: 30
