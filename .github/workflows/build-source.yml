name: Whole-mod source compile (report only)

# ---------------------------------------------------------------------------
# Devouring Storms Track B step 2: compile the ENTIRE mod from the recovered
# source (src-recon/) plus our overlay (mcsm-extras/) with no base jar on the
# classpath. Report-only: annotations + out/source-build-report.txt artifact.
# The shipping pipeline (build-mcsm.yml) is untouched until parity is proven
# and the player verifies in game; then this becomes Devouring Storms 2.0.0.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
  push:
    branches: [arena/01a07250-lowuuuuuu]
    paths:
      - ci/build-source.sh
      - ci/widen_members.py
      - ci/strip_typeann.py
      - ci/stubs/**
      - .github/workflows/build-source.yml
      - src-recon/**

permissions:
  contents: write   # the report-publish step pushes ci/reports/ back

concurrency:
  group: build-source
  cancel-in-progress: true

jobs:
  source-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"

      - name: Compile the whole mod from source
        run: bash ci/build-source.sh

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-build-${{ github.run_number }}
          path: out/

      # The sandbox cannot download GitHub log/artifact blobs, so the report
      # travels back through git instead. ci/reports/** is NOT a trigger
      # path, so this commit cannot re-run the workflow.
      - name: Publish report to repo
        if: always()
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f ci/reports/source-build-latest.txt ]; then
            git config user.name "ds-ci-bot"
            git config user.email "ci@devouringstorms.local"
            git add ci/reports/source-build-latest.txt
            if ! git diff --cached --quiet; then
              git commit -m "chore(ci): source-build report for run ${{ github.run_number }} [no-ci]"
              git push "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }} || echo "::warning::report push failed"
            fi
          fi
