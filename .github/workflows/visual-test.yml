name: Visual Client Test

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  visual-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Virtual Display & Screenshot Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri scrot

      - name: Locate Project & Build Mod
        id: build_step
        run: |
          GRADLE_FILE=$(find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -not -path '*/.*' | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "No build.gradle found on current branch. Checking other branches..."
            for branch in $(git branch -r | grep -v '\->' | sed 's/origin\///'); do
              if git ls-tree -r --name-only "origin/$branch" | grep -qE "build\.gradle(\.kts)?$"; then
                echo "Found build.gradle on branch: $branch. Switching..."
                git checkout "$branch"
                GRADLE_FILE=$(find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -not -path '*/.*' | head -n 1)
                break
              fi
            done
          fi

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: No build.gradle found anywhere in this repository."
            echo "Top-level files present:"
            ls -la
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Building project in: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: Run Client & Capture Screenshots
        if: success()
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          mkdir -p screenshots
          OUT_DIR="$(pwd)/screenshots"
          PROJECT_DIR="${{ steps.build_step.outputs.project_dir }}"
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            CMD="./gradlew runClient --no-daemon"
          else
            CMD="gradle runClient --no-daemon"
          fi

          xvfb-run --server-num=99 --server-args="-screen 0 1280x720x24" $CMD &
          CLIENT_PID=$!
          sleep 45
          DISPLAY=:99 scrot "$OUT_DIR/01_launch.png" || true
          sleep 15
          DISPLAY=:99 scrot "$OUT_DIR/02_after_wait.png" || true
          kill $CLIENT_PID || true

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-test-screenshots
          path: screenshots/
          if-no-files-found: ignore
