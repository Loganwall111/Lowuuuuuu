name: Visual Client Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  visual-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Virtual Display & Screenshot Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri scrot

      - name: Build Mod
        run: chmod +x gradlew && ./gradlew build

      - name: Run Client & Capture Screenshots
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          mkdir -p screenshots
          xvfb-run --server-num=99 --server-args="-screen 0 1280x720x24" ./gradlew runClient &
          CLIENT_PID=$!
          sleep 40
          DISPLAY=:99 scrot screenshots/01_title_screen.png || true
          sleep 15
          DISPLAY=:99 scrot screenshots/02_after_wait.png || true
          kill $CLIENT_PID || true

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-test-screenshots
          path: screenshots/
