name: Visual Client Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  visual-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Virtual Display & Screenshot Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri scrot

      - name: Build Mod
        run: |
          PROJECT_DIR=$(dirname $(find . -maxdepth 3 -name "build.gradle*" | head -n 1))
          echo "Found project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew build
          else
            gradle build
          fi

      - name: Run Client & Capture Screenshots
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          mkdir -p screenshots
          OUT_DIR="$(pwd)/screenshots"
          PROJECT_DIR=$(dirname $(find . -maxdepth 3 -name "build.gradle*" | head -n 1))
          cd "$PROJECT_DIR"
          if [ -f "./gradlew" ]; then
            CMD="./gradlew runClient"
          else
            CMD="gradle runClient"
          fi
          xvfb-run --server-num=99 --server-args="-screen 0 1280x720x24" $CMD &
          CLIENT_PID=$!
          sleep 45
          DISPLAY=:99 scrot "$OUT_DIR/01_title_screen.png" || true
          sleep 15
          DISPLAY=:99 scrot "$OUT_DIR/02_after_wait.png" || true
          kill $CLIENT_PID || true

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-test-screenshots
          path: screenshots/
