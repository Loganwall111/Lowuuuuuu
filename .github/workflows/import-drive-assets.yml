name: Import Drive Assets

# One-shot relay: GitHub-hosted runners have unrestricted egress, so this
# downloads the user's public Google Drive folder (all MCSM wither storm
# assets, shaders, models and textures) and pushes them onto the
# `drive-assets-import` branch so the sandbox can fetch them via git.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arena/01a04a20-lowuuuuuu

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install gdown
        run: pip install --quiet gdown

      - name: Download Drive assets
        shell: bash
        run: |
          set -x
          rm -rf drive_import
          mkdir -p drive_import
          cd drive_import
          # Root folder (7 top-level files + 2 subfolders)
          gdown --folder --remaining-ok "https://drive.google.com/drive/folders/1qpcSWjqjApbIYNRrgtLAspRO9RPD7EqV" || echo "ROOT_FOLDER_DOWNLOAD_FAILED"
          # "ALL wither storm assets from MCSM for blockbench you'll ever need V0.9"
          gdown --folder --remaining-ok "https://drive.google.com/drive/folders/1wdyNy5NblIkoUda1OGN-Qrz4HzZGjJ3R" || echo "BLOCKBENCH_FOLDER_DOWNLOAD_FAILED"
          # "assets" resource-pack folder
          gdown --folder --remaining-ok "https://drive.google.com/drive/folders/1MSiAVOyx1qPt-U8LAxvM-otxYwtThIAk" || echo "ASSETS_FOLDER_DOWNLOAD_FAILED"
          # Explicit per-file fallbacks for the top-level files
          gdown --remaining-ok "https://drive.google.com/uc?id=1QPtSNtACqStL7dc-rZUXXjrcOdKL9WRS" -O mcsm.zip || echo "MCSM_ZIP_FAILED"
          gdown --remaining-ok "https://drive.google.com/uc?id=1_wwf7MEZ0sArzYf5OydlH8brNZ2Sav5Z" -O MCSM_Vision_Shader.zip || echo "VISION_FAILED"
          gdown --remaining-ok "https://drive.google.com/uc?id=1pDrFqoA3sHoeD4IKKzfFbLS1uuT0lTLo" -O "ReShaded_[v.1.4.2]_26.1.zip" || echo "RESHADED_FAILED"
          gdown --remaining-ok "https://drive.google.com/uc?id=1vp3T_6s3cr25iH_4Xm1tocKIvFk9z5cE" -O shaders.zip || echo "SHADERS_FAILED"
          gdown --remaining-ok "https://drive.google.com/uc?id=1bX6X41RZ54BbNdOQRvfAf5tokFAxPPgA" -O "Story_Mode_Clouds.zip" || echo "CLOUDS_FAILED"
          gdown --remaining-ok "https://drive.google.com/uc?id=1XFQLBgfSBvWzA5J5iivMK4tB7R83i4J-" -O Vortex.bbmodel || echo "VORTEX_FAILED"
          gdown --remaining-ok "https://drive.google.com/uc?id=1TR2RiJILBBu51Uxmjnkf9vksmbx6m0oW" -O witherstormHalo.bbmodel || echo "HALO_FAILED"
          cd ..
          echo "=== IMPORTED FILES ==="
          find drive_import -type f | sort
          echo "=== FILE COUNT ==="
          find drive_import -type f | wc -l

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import public Google Drive MCSM assets (relay)" || echo "nothing to commit"
          git push origin HEAD:drive-assets-import
