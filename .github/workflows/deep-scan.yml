name: Deep scan of the base mod

# ---------------------------------------------------------------------------
# Devouring Storms -- the "fix the original author's broken features" track
# needs to see compiled classes the sandbox cannot download and has no JDK
# for. This dispatched workflow runs ci/deep-scan.sh on a runner (which can
# do both) and commits the disassembly back to the branch it was dispatched
# from, under ci/api/scan/.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deep-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Scan the base mod jar
        run: bash ci/deep-scan.sh

      - name: Commit scan results back to this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "devouring-ci"
          git config user.email "devouring-ci@users.noreply.github.com"
          git add ci/api/scan
          if git diff --cached --quiet; then
            echo "no scan changes to commit"
          else
            git commit -m "Deep scan: base mod class list, strings, javap disassembly"
            git push origin "HEAD:${GITHUB_REF#refs/heads/}"
          fi

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deep-scan-${{ github.run_number }}
          path: ci/api/scan/
