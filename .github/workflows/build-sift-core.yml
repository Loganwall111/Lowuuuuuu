name: Build Sift-Core standalone mod

# The parent project is compiled by build-mcsm.yml. This workflow is the
# dedicated compiler for the isolated 1.20.1 sandbox, so Sift-Core can evolve
# without being assembled into the Devouring Storms jar.
on:
  push:
    branches: ['arena/**', 'main']
    paths:
      - 'sift-core/**'
      - '.github/workflows/build-sift-core.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sift-core-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the sandbox
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate Sift-Core inputs
        run: python3 sift-core/tools/validate.py

      - name: Compile and package Sift-Core
        run: |
          set +e
          gradle --no-daemon --console=plain --stacktrace -p sift-core build 2>&1 \
            | tee "$GITHUB_WORKSPACE/sift-core/gradle-ci.log"
          rc=${PIPESTATUS[0]}
          exit "$rc"

      - name: Expose Gradle diagnostics
        if: failure()
        run: |
          if [ -f sift-core/gradle-ci.log ]; then
            {
              echo '### Sift-Core Gradle diagnostics'
              echo '```text'
              grep -n -E 'FAILURE:|What went wrong:|Could not |Execution failed|Caused by:|error:' sift-core/gradle-ci.log || true
              echo '--- tail ---'
              tail -80 sift-core/gradle-ci.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -n -E 'FAILURE:|What went wrong:|Could not |Execution failed|Caused by:|error:' sift-core/gradle-ci.log \
              | head -40 | while IFS= read -r line; do
                line=${line:0:900}
                echo "::error title=Sift-Core Gradle::$line"
              done
          fi

      - name: Upload standalone jar and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sift-core-${{ github.run_number }}
          path: |
            sift-core/build/libs/*.jar
            sift-core/build/reports/**
            sift-core/gradle-ci.log
          if-no-files-found: warn
