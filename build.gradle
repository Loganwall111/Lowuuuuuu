plugins {
	// Minecraft 26.1+ is UNOBFUSCATED: there are no mappings and Loom does not remap.
	// The 26.x plugin id is "net.fabricmc.fabric-loom" (not the old "fabric-loom").
	// See https://docs.fabricmc.net/develop/porting/mappings/
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven { url = "https://maven.fabricmc.net/" }
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

loom {
	// NOTE: do NOT use splitEnvironmentSourceSets() here. This mod keeps all of its
	// code (including the client-only renderers/models in src/main/java) in the MAIN
	// source set, and those classes reference net.minecraft.client.* directly.
	// With split source sets, net.minecraft.client.* is only on the `client` source
	// set's classpath, so the main source set fails with "package net.minecraft.client
	// does not exist". The original mod was built without split source sets.

	mods {
		"dabywitherstormmod" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	// Fabric Loom 1.17+ for MC 26.x (unobfuscated): use modImplementation for
	// Fabric Loader and Fabric API so they are available at compile time but
	// NOT bundled into the output JAR.  Using plain `implementation` causes
	// Loom to embed the entire dependency tree, producing a 150 MB+ fat JAR
	// that Fabric Loader cannot recognise as a mod.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu (for the config screen integration). Client-only, so compileOnly + included
	// by the runtime if present; ModMenuIntegration only compiles against its API.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25

	// The decompiled Blockbench model classes contain single expressions with
	// thousands of chained calls (e.g. WitherStormP4.createBodyLayer / HugeAssBackModel).
	// javac's TransTypes generic-translation pass recurses through that whole chain and
	// overflows the default JVM thread stack with a StackOverflowError. Compile in a
	// forked JVM with a large stack so those deep expressions translate successfully.
	it.options.fork = true
	it.options.forkOptions.jvmArgs = ["-Xss64m"]
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.archives_base_name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}

	// Blockbench .bbmodel files are editor SOURCE projects (~340 MB) kept in the
	// repo for model work; the runtime loads the exported .json geometry only.
	// Shipping them made the production jar 126 MB of dead weight.
	exclude "**/*.bbmodel"
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

gradle.taskGraph.afterTask { Task task, TaskState state ->
	if (state.failure != null) {
		def msg = (state.failure.message ?: state.failure.toString())
		def cur = state.failure.cause
		while (cur != null) {
			msg += " === CAUSED BY: " + (cur.message ?: cur.toString())
			cur = cur.cause
		}
		if (msg.length() > 3000) msg = msg.substring(0, 3000)
		msg = msg.replace("\r", "").replace("\n", "%0A")
		println "::error title=Gradle Task ${task.name} Failure::${msg}"
	}
}
