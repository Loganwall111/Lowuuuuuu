# MINECRAFT: STORY MODE — Official Atmosphere Shaderpack
# Compatible with Iris (Fabric) and OptiFine (Java Edition).

# Sun, moon, and vanilla celestial alignment
clouds=off
sky.stars=vanilla
sun=true
moon=true

shadow.enabled=false
particles.before=false

# Visual Configuration
profile=mcsm_story_mode
MCSM_PINK_SKY=1
MCSM_HORIZON_GLOW=1
MCSM_ROILING_CLOUDS=1
MCSM_STORM_FOG=1
MCSM_CINEMATIC_GRADE=1
MCSM_VIGNETTE=0
MCSM_GRAIN=0
MCSM_RETRO_VHS=0
