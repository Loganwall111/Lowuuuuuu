# Minecraft: Story Mode — Shaderpack Configuration & Pipeline Routing
# Clouds are 100% procedural GLSL (fractal noise) — no PNG cloud sheets.
clouds=fast
customSkies=true

# Sun shadow map: cast shadows on the ground and on water, sweeping with the
# live day/night clock.
shadowDistance=192.0
shadowIntervalSize=3

screen=CLOUD_EXTRUSION CLOUDS_ACTIVE DYNAMIC_SKY MCSM_LIGHTING EMISSIVE_TEETH_GLOW
screen.MCSM_OPTIONS=CLOUD_EXTRUSION CLOUDS_ACTIVE DYNAMIC_SKY MCSM_LIGHTING EMISSIVE_TEETH_GLOW
