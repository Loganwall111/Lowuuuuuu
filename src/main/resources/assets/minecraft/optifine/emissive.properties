# Marks the Wither Storm's teeth and eye as EMISSIVE for OptiFine-format shader pipelines
# (OptiFine natively; Iris via Entity Texture Features).
#
# The mod's own HDR bloom is disabled whenever a shader pack is loaded -- it draws through
# custom Blaze3D pipelines the pack never sets up, which is what turned the storm's body solid
# white. This is the replacement: rather than compositing a glow ourselves, the teeth and eye are
# declared emissive and the pack's OWN bloom picks them up, in whatever style that pack uses.
#
# phase_4_assets_e.png is generated from the exact UV rectangles the glow model layers use --
# texOffs(8,510) for every tooth, texOffs(0,508) for the eye -- and only the lit colours inside
# them (171,171,171 and 171,43,185). Everything else is transparent, so nothing else can glow.
suffix.emissive=_e
