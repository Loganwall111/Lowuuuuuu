<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ocean Worlds — Realtime Water Physics Simulator</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04070c;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  #renderCanvas { position: fixed; inset: 0; width: 100%; height: 100%; outline: none; display: block; }
  .chip { position: fixed; z-index: 20; padding: 7px 12px; border-radius: 9px;
    background: rgba(8, 12, 20, .72); border: 1px solid rgba(140, 190, 255, .16);
    color: #bcd4ee; font-size: 11.5px; backdrop-filter: blur(8px); pointer-events: none; }
  #hint { left: 12px; bottom: 12px; line-height: 1.7; }
  #hint b { color: #eaf4ff; }
  #home { left: 12px; top: 12px; pointer-events: auto; cursor: pointer; text-decoration: none; }
  #home:hover { background: rgba(30, 50, 80, .85); }
  #gl1warn { display: none; left: 50%; top: 12px; transform: translateX(-50%); color: #ffd9a8;
    border-color: rgba(255, 200, 120, .4); }
  #loading, #error { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: #04070c; color: #cfe2f8; gap: 14px; }
  #error { display: none; }
  .spinner { width: 46px; height: 46px; border-radius: 50%; border: 3px solid rgba(127, 212, 255, .15);
    border-top-color: #7fd4ff; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  #loading p, #error p { max-width: 520px; text-align: center; color: #8fb0d4; font-size: 14px; line-height: 1.6; }
  #error h2 { color: #ff9d9d; margin: 0; }
</style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <a id="home" class="chip" href="../">← LOW Suite</a>
  <div id="hint" class="chip"><b>Drag</b> orbit · <b>Scroll</b> zoom · <b>Click ocean</b> to spawn · <b>Drag a floater</b> to move it (scroll = height, flick = throw) ·
    <b>H</b> toggles the control panel</div>
  <div id="gl1warn" class="chip">WebGL 1 fallback detected — this experience is designed for WebGL 2.</div>

  <div id="loading"><div class="spinner"></div><p>Summoning the ocean…</p></div>
  <div id="error"><h2>Unable to start</h2><p></p></div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="../shared/util.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="./glsl.js"></script>
  <script src="./world.js"></script>
  <script src="./physics.js"></script>
  <script src="./main.js"></script>
</body>
</html>
